apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ autoscaler_deployment_name }}
  namespace: {{ namespace }}
  labels:
    app: customdas-cpu-queue-autoscaler
    target-deployment: {{ target_deployment }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customdas-cpu-queue-autoscaler
      target-deployment: {{ target_deployment }}
  template:
    metadata:
      labels:
        app: customdas-cpu-queue-autoscaler
        target-deployment: {{ target_deployment }}
    spec:
      serviceAccountName: {{ service_account_name }}
      containers:
        - name: customdas-cpu-queue-autoscaler
          image: {{ image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ p2p_hub_port }}
              name: p2p
          env:
            - name: NAMESPACE
              value: "{{ target_namespace }}"
            - name: TARGET_DEPLOYMENT
              value: "{{ target_deployment }}"
            - name: PROM_URL
              value: "{{ prom_url }}"
            - name: INTERVAL
              value: "{{ interval }}"
            - name: COOLDOWN_SECONDS
              value: "{{ cooldown_seconds }}"
            - name: SCALE_UP_COOLDOWN_SECONDS
              value: "{{ scale_up_cooldown_seconds }}"
            - name: SCALE_DOWN_COOLDOWN_SECONDS
              value: "{{ scale_down_cooldown_seconds }}"

            - name: APP_NAME
              value: "{{ app_name }}"
            - name: ROOT_SERVICE
              value: "{{ root_service }}"
              
            - name: PEER_ID
              value: "{{ peer_id }}"
            - name: P2P_HUB_HOST
              value: "{{ p2p_hub_host }}"
            - name: P2P_HUB_PORT
              value: "{{ p2p_hub_port }}"
            - name: IS_P2P_HUB
              value: "{{ is_p2p_hub }}"

            - name: MIN_REPLICAS
              value: "{{ min_replicas }}"
            - name: MAX_REPLICAS
              value: "{{ max_replicas }}"

            - name: LATENCY_SLO_MS
              value: "{{ slo_ms }}"
            - name: SLO_MS
              value: "{{ slo_ms }}"
            - name: LATENCY_SLO_MS_LEAF_MS
              value: "{{ slo_leaf_ms }}"
            - name: SLO_LATENCY_PERCENTILE
              value: "{{ slo_latency_percentile }}"
            - name: QUEUE_MODEL_PERCENTILE
              value: "{{ queue_model_percentile }}"
            - name: LOG_FILE
              value: "{{ log_file }}"
            - name: ENABLE_COLOURED_LOGS
              value: "{{ enable_coloured_logs }}"
            - name: LATENCY_SLO_MODE
              value: "{{ latency_slo_mode }}"
            - name: QUEUE_MODEL
              value: "{{ queue_model }}"
            - name: SERVICE_TIME_UPDATE_INTERVAL_SECONDS
              value: "{{ service_time_update_interval_seconds }}"
            - name: SERVICE_TIME_EWMA_ALPHA
              value: "{{ service_time_ewma_alpha }}"
            - name: MIN_PROCESSING_TIME_MS
              value: "{{ min_processing_time_ms }}"
            - name: GGC_INITIAL_K
              value: "{{ ggc_initial_k }}"
            - name: GGC_K_UPDATE_INTERVAL_SECONDS
              value: "{{ ggc_k_update_interval_seconds }}"
            - name: GGC_K_EWMA_ALPHA
              value: "{{ ggc_k_ewma_alpha }}"
            - name: GGC_K_MIN
              value: "{{ ggc_k_min }}"
            - name: GGC_K_MAX
              value: "{{ ggc_k_max }}"
            - name: FRONTEND_HEALTHY_LATENCY_MS
              value: "{{ frontend_healthy_latency_ms }}"
            - name: SCALE_DOWN_MIN_WINDOWS
              value: "{{ scale_down_min_windows }}"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: {{ autoscaler_deployment_name }}
  namespace: {{ namespace }}
  labels:
    app: customdas-cpu-queue-autoscaler
    target-deployment: {{ target_deployment }}
spec:
  selector:
    app: customdas-cpu-queue-autoscaler
    target-deployment: {{ target_deployment }}
  ports:
    - name: p2p
      protocol: TCP
      port: {{ p2p_hub_port }}
      targetPort: {{ p2p_hub_port }}
  type: ClusterIP
