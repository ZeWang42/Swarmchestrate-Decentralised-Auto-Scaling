apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-boutique-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: 3.8.101.22.nip.io  # 👈 Use your EC2 IP (nip.io auto-resolves to it)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: cartservice
            port:
              number: 7070
      - path: /checkout
        pathType: Prefix
        backend:
          service:
            name: checkoutservice
            port:
              number: 5050
      - path: /currency
        pathType: Prefix
        backend:
          service:
            name: currencyservice
            port:
              number: 7000
      - path: /email
        pathType: Prefix
        backend:
          service:
            name: emailservice
            port:
              number: 5000
      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: paymentservice
            port:
              number: 50051
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: productcatalogservice
            port:
              number: 3550
      - path: /recommend
        pathType: Prefix
        backend:
          service:
            name: recommendationservice
            port:
              number: 8080
      - path: /ship
        pathType: Prefix
        backend:
          service:
            name: shippingservice
            port:
              number: 50051
      - path: /ads
        pathType: Prefix
        backend:
          service:
            name: adservice
            port:
              number: 9555

