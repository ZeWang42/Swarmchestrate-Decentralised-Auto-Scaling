apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ deployment_name }}-hpa
  namespace: {{ namespace }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ deployment_name }}

  minReplicas: {{ min_replicas }}
  maxReplicas: {{ max_replicas }}

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ average_cpu_utilization }}

  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ scale_up_stabilization_window_seconds }}
      selectPolicy: {{ scale_up_select_policy }}
      policies:
        - type: {{ scale_up_policy_type }}
          value: {{ scale_up_policy_value }}
          periodSeconds: {{ scale_up_policy_period_seconds }}

    scaleDown:
      stabilizationWindowSeconds: {{ scale_down_stabilization_window_seconds }}
      selectPolicy: {{ scale_down_select_policy }}
      policies:
        - type: {{ scale_down_policy_type }}
          value: {{ scale_down_policy_value }}
          periodSeconds: {{ scale_down_policy_period_seconds }}
